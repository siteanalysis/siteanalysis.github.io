<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Site Diagrams</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@7.1.0/turf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/terra-draw@1.35.0/dist/terra-draw.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/terra-draw-maplibre-gl-adapter@1.4.1/dist/terra-draw-maplibre-gl-adapter.umd.js"></script>
<style>
  :root {
    --panel: #16181c;
    --text: #e9e9ea;
    --muted: #9a9ca3;
    --line: rgba(255, 255, 255, 0.12);
    --accent: #ff6a3d;
    --workspace: #d9d9d9;
  }
  html, body { margin: 0; height: 100%; background: var(--workspace); }
  body { display: flex; font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif; color: var(--text); }

  #panel {
    width: 300px; flex-shrink: 0; background: var(--panel); overflow-y: auto;
    padding: 12px 14px; box-sizing: border-box; height: 100%;
  }
  #panel header { display: flex; align-items: baseline; justify-content: space-between; }
  #panel h1 { font-size: 14px; margin: 0 0 8px; }
  .credit { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 8px; color: var(--muted); font-size: 11px; }
  .credit a { color: var(--muted); text-decoration: underline; }
  #panel header a { color: var(--accent); text-decoration: none; font-size: 12px; }
  section { border-top: 1px solid var(--line); padding: 10px 0 6px; }
  section h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; }
  .row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .row label { color: var(--muted); flex-shrink: 0; min-width: 70px; }
  .row input[type=range] { flex: 1; accent-color: var(--accent); min-width: 0; }
  .row .val { width: 54px; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .check { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; cursor: pointer; }
  .check input { accent-color: var(--accent); }
  input[type=text] {
    background: rgba(255,255,255,.06); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 7px; font: inherit; min-width: 0; flex: 1;
  }
  button {
    background: rgba(255,255,255,.08); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 9px; font: inherit; cursor: pointer; text-align: left;
  }
  button:hover:not(:disabled) { background: rgba(255,255,255,.14); }
  button:disabled { opacity: .5; cursor: default; }
  button.active { background: var(--accent); border-color: var(--accent); color: #111; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 6px; }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  #swotTools i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  .hint { color: var(--muted); font-size: 12px; margin: 2px 0 6px; }
  #status { color: var(--muted); font-size: 12px; min-height: 16px; }
  #status.error { color: #ff8a80; }

  .search { position: relative; margin-bottom: 8px; }
  .search input { width: 100%; box-sizing: border-box; padding: 7px 9px; font-size: 14px; }
  #results {
    list-style: none; margin: 4px 0 0; padding: 4px; display: none;
    background: #1d2025; border: 1px solid var(--line); border-radius: 6px;
    position: absolute; left: 0; right: 0; z-index: 5; max-height: 260px; overflow-y: auto;
  }
  #results li { padding: 6px 8px; border-radius: 4px; cursor: pointer; }
  #results li:hover, #results li.active { background: rgba(255,106,61,.25); }
  #results li.empty { color: var(--muted); cursor: default; background: none; }

  #workspace { flex: 1; position: relative; display: grid; place-items: center; overflow: hidden; min-width: 0; }
  #sheet { position: relative; background: #fff; box-shadow: 0 6px 30px rgba(0,0,0,.18); }
  #mapWrap { position: absolute; overflow: hidden; }
  #canvas, #map { position: absolute; inset: 0; width: 100%; height: 100%; }
  #chrome { position: absolute; inset: 0; pointer-events: none; }
  .maplibregl-canvas:focus { outline: none; }

  @media (max-width: 700px) {
    body { flex-direction: column; }
    #panel { width: 100%; height: 45%; }
    #workspace { height: 55%; }
  }
</style>
</head>
<body>
<aside id="panel">
  <header>
    <h1>Site Diagrams</h1>
    <a id="link3d" href="index.html">← 3D view</a>
  </header>

  <section>
    <h2>Site</h2>
    <div class="search">
      <input type="text" id="search" placeholder="Search city, address or place…" autocomplete="off" spellcheck="false">
      <ul id="results"></ul>
    </div>
    <div class="row">
      <input type="text" id="coords" placeholder="lat, lon">
      <button id="coordsGo">Go</button>
    </div>
    <div class="row">
      <label>Radius</label>
      <input type="range" id="radius" min="400" max="2000" step="100">
      <span class="val" id="radiusVal"></span>
    </div>
    <div class="row"><button id="reloadBtn">Load area</button></div>
    <div id="status"></div>
  </section>

  <section>
    <h2>Diagram</h2>
    <div class="grid" id="presets"></div>
    <div class="row"><input type="text" id="titleInput" placeholder="Title"></div>
    <div class="row" id="heightRow">
      <label>Height</label>
      <input type="range" id="heightScale" min="0.5" max="3" step="0.1" value="1">
      <span class="val" id="heightVal">1.0×</span>
    </div>
    <div class="row" id="bufferRow">
      <label>Park buffer</label>
      <input type="range" id="buffer" min="100" max="1000" step="50" value="400">
      <span class="val" id="bufferVal">400 m</span>
    </div>
  </section>

  <section>
    <h2>Overlays</h2>
    <label class="check"><input type="checkbox" id="siteOn" checked> Site footprint</label>
    <label class="check"><input type="checkbox" id="isoOn"> Walking isochrones (5 / 10 / 15 min)</label>
    <label class="check"><input type="checkbox" id="swotOn" checked> SWOT drawings</label>
  </section>

  <section>
    <h2>SWOT</h2>
    <div class="grid" id="swotTools"></div>
    <div class="hint" id="swotHint">Pick a category, then draw on the map.</div>
    <div class="btns">
      <button id="undoBtn">Undo</button>
      <button id="clearBtn">Clear all</button>
    </div>
  </section>

  <section>
    <h2>Export (A3 portrait)</h2>
    <div class="btns">
      <button data-export="svg">SVG · vector</button>
      <button data-export="png">PNG · 300 dpi</button>
    </div>
  </section>
  <footer class="credit">Built by <a href="https://github.com/ConstantineMalynin" target="_blank" rel="noopener">Constantine Malynin</a> · <a href="https://github.com/siteanalysis/siteanalysis.github.io" target="_blank" rel="noopener">source</a></footer>
</aside>

<main id="workspace">
  <div id="sheet">
    <div id="mapWrap">
      <canvas id="canvas"></canvas>
      <div id="map"></div>
    </div>
    <svg id="chrome" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
</main>

<script type="module" src="js/diagrams.js"></script>
</body>
</html>
